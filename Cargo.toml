[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/agent-proofs",
    "crates/circuits-sdkey",
    "crates/circuits-cfc",
    "crates/agent-cli",
    "crates/realm-sink",
    "crates/agent-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["PsyGuard Team"]

[workspace.dependencies]
# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# 存储
sled = "0.34"

# 加密/哈希
blake3 = "1.5"
sha2 = "0.10"
sha3 = "0.10"

# EVM 集成
ethers = { version = "2", features = ["ws", "rustls"] }

# HTTP 客户端
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Web 框架
actix-web = "4"
actix-cors = "0.7"

# RISC Zero (证明系统)
risc0-zkvm = { version = "1.0", default-features = false }

# 测试
proptest = "1.4"
insta = "1.34"

# 实用工具
hex = "0.4"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
